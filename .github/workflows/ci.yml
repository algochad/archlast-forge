name: CI

# Contributors open pull requests into `staging`; the owner reviews them there. `master` only takes staging (the `source-branch` job), and the
# engine image is built only when master is updated.
on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U forge" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgres://forge:forge@localhost:55432/forge
      TEST_REDIS_URL: redis://localhost:56379
      TEST_S3_ENDPOINT: http://localhost:59000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Start RustFS and create the test bucket
        run: |
          docker run -d --name rustfs -p 59000:9000 -e RUSTFS_ACCESS_KEY=forgeadmin -e RUSTFS_SECRET_KEY=forgeadmin -e RUSTFS_CORS_ALLOWED_ORIGINS='*' rustfs/rustfs:1.0.4 /data
          for i in $(seq 1 30); do
            docker run --rm --network host -e AWS_ACCESS_KEY_ID=forgeadmin -e AWS_SECRET_ACCESS_KEY=forgeadmin -e AWS_DEFAULT_REGION=us-east-1 \
              amazon/aws-cli:2.39.3 --endpoint-url http://localhost:59000 s3 mb s3://forge && break
            sleep 1
          done
      - run: bun install --frozen-lockfile
      - name: Chromium for the browser tests
        run: cd packages/framework && bunx playwright-core install --with-deps chromium
      - name: Agent skill (front matter, links, imports of every code sample)
        run: bun run skill:check
      - name: Release rules (which merges release, and which version)
        run: bun test scripts/release-bump.test.ts scripts/release-notes.test.ts
      - name: Typecheck and build
        run: bunx turbo build typecheck
      - name: Test (SQLite, Postgres, Redis, S3, two servers)
        run: bunx turbo test --concurrency=1

  # Packaging creates the tarballs used by both Docker end-to-end scripts. Run on a separate runner so its containers and ports are isolated.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Package smoke test (packed tarballs, a full-stack app and a backend, each served)
        run: bun scripts/pack.ts --smoke
      - name: Docker end to end (the stack with `up`, and `dev` with services)
        run: |
          bun packages/cli/src/index.ts engine build
          bun scripts/e2e-docker.ts
          bun scripts/e2e-dev.ts

  # Keep the required check named "test": neither a skipped nor a failed prerequisite may pass the branch protection gate.
  test:
    if: ${{ always() }}
    needs: [suite, packaging]
    runs-on: ubuntu-latest
    steps:
      - name: Require the test suite and packaging
        env:
          SUITE: ${{ needs.suite.result }}
          PACKAGING: ${{ needs.packaging.result }}
        run: |
          echo "suite: $SUITE; packaging: $PACKAGING"
          [ "$SUITE" = success ] && [ "$PACKAGING" = success ]

  # Only when master is updated, which is a merge from staging: not for pull requests (a pull request that doesn't touch the Dockerfile has
  # nothing to learn from it) and not for staging. It builds the image and runs it, and pushes nothing. When this run succeeds on a merge that
  # sets a version npm doesn't have, release.yml publishes the image and the packages from this commit.
  engine-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the engine image
        run: docker build -f docker/engine.Dockerfile -t archlast-forge/engine:ci .
      - name: Engine CLI starts
        run: docker run --rm archlast-forge/engine:ci --help | grep -q "archlast-forge"
      # Its files unpacked, measured inside it (docker's own size figures differ between storage drivers). 0.19.0 was 632 MB; this one is about 220.
      - name: The engine image stays small
        run: |
          MB=$(docker run --rm --entrypoint du archlast-forge/engine:ci -sxm / | cut -f1)
          echo "engine image: ${MB} MB unpacked"
          [ "$MB" -le 260 ] || { echo "::error::The engine image is ${MB} MB unpacked, over 260: a new runtime dependency, or something docker/engine.Dockerfile should leave out"; exit 1; }

  # Pull requests into master come from staging only, and from this repository: a fork's branch called staging doesn't count.
  source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: The pull request comes from staging
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Until the staging branch exists there is nothing to come from: the pull request that introduces it is the one that gets through.
          # Only a plain "no such branch" counts; any other answer (a rate limit, a token that can't read) fails the check instead of passing it.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/staging")
          if [ "$code" = "404" ]; then
            echo "There is no staging branch yet, so this pull request, which introduces the branch model, can't come from it."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Could not tell whether the staging branch exists (GitHub answered $code)."
            exit 1
          fi
          if [ "$HEAD_REF" != "staging" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::master takes pull requests from the staging branch of this repository only (this one is from $HEAD_REPO:$HEAD_REF). Open the pull request into staging; the owner merges staging into master."
            exit 1
          fi

  # A pull request into master that changes the version has its release notes in the docs (apps/docs/content/release-notes.mdx).
  release-notes:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: git fetch origin master
      - run: bun scripts/check-release-notes.ts origin/master
