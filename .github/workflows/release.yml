name: Release

# Push a tag like v0.2.0 after `bun scripts/version.ts 0.2.0` and a commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # The engine image goes first: a new project's `archlast-forge up` pulls it as soon as the packages exist.
    needs: engine-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Pack and smoke-test
        run: bun scripts/pack.ts --smoke
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm itself publishes: `bun publish` doesn't send the token for new packages.
          test -n "$NPM_TOKEN" || { echo "Add the NPM_TOKEN repository secret (a granular token with read and write on all packages)"; exit 1; }
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          # 0.2.0-rc.1 and the like are published under the "next" tag, so `latest` only moves for real releases.
          TAG=latest; case "$GITHUB_REF_NAME" in *-*) TAG=next;; esac
          for f in .pack/*.tgz; do npm publish "$f" --access public --tag $TAG; done

  engine-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the engine image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          IMAGE=ghcr.io/${{ github.repository_owner }}/archlast-forge-engine
          docker build -f docker/engine.Dockerfile -t $IMAGE:$VERSION -t $IMAGE:latest .
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest
