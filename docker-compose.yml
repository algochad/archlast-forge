# Services for adapter contract tests and multi-server runs: `bun run services:up`.
name: archlast-forge
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: forgeadmin
      RUSTFS_SECRET_KEY: forgeadmin
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    ports: ["59000:9000"]
    command: ["/data"]
