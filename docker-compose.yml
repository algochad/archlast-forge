# Services for adapter contract tests and multi-server runs: `bun run services:up`.
name: archlast-forge
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 2s
      retries: 20
  # A replica set of one: MongoDB's transactions need one. The health check starts it the first time.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["57017:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }\" | grep -q 1"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: forgeadmin
      RUSTFS_SECRET_KEY: forgeadmin
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    ports: ["59000:9000"]
    command: ["/data"]
  rustfs-init:
    image: amazon/aws-cli:2.39.3
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: forgeadmin
      AWS_SECRET_ACCESS_KEY: forgeadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c", "for i in $$(seq 1 30); do aws --endpoint-url http://rustfs:9000 s3 mb s3://forge 2>&1 | grep -qE 'make_bucket|BucketAlready' && exit 0; sleep 1; done; exit 1"]
