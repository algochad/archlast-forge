[env]
# SQLite's compile-time options for an embedded, single-process database (from the options SQLite recommends): no memory statistics, no deprecated interfaces, no shared cache.
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_OMIT_DEPRECATED -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_USE_ALLOCA"
