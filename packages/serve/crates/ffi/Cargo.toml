[package]
name = "archlast-serve-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
archlast-serve-core = { path = "../core" }
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
default = []
mimalloc = ["dep:mimalloc"]
profile = ["archlast-serve-core/profile"]
