[package]
name = "client"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate: NOT part of the parent cargo workspace.
[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
