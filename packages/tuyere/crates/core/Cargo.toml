[package]
name = "tuyere-core"
version = "0.2.0"
edition = "2021"

[features]
default = []
# Sampling profiler for development: ARCHLAST_PROFILE=<file>:<seconds> writes folded stacks per thread (see profile.rs).
profile = ["dep:pprof"]

[build-dependencies]
cc = "1"

[dependencies]
pprof = { version = "0.14", optional = true, default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "fs", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
bytes = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "http2"] }
socket2 = { version = "0.5", features = ["all"] }
http-body = "1"
http-body-util = "0.1"
mime_guess = "2"
httpdate = "1"
tokio-util = { version = "0.7", features = ["io"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
